[preset.0]
name="macOS Universal"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="assets/generated/*.json,THIRD_PARTY_NOTICES.txt"
exclude_filter="tests/*,README.md,engine-lock.json"
export_path="../build/godot/NineTripods-godot-macos.zip"

[preset.0.options]
binary_format/architecture="universal"
application/bundle_identifier="com.ninetripods.tanggu.sample"
application/short_version="0.3.0"
application/version="0.3.0"
application/copyright="九鼎项目"
codesign/codesign=1
notarization/notarization=0
display/high_res=true

[preset.1]
name="Windows x64"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/generated/*.json,THIRD_PARTY_NOTICES.txt"
exclude_filter="tests/*,README.md,engine-lock.json"
export_path="../build/godot/candidate-windows/NineTripods.exe"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
codesign/enable=false
application/modify_resources=true
application/file_version="0.3.0.0"
application/product_version="0.3.0.0"
application/product_name="Nine Tripods Tanggu Sample"
